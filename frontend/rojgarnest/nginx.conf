# ============================================================
# ROJGARNEST FRONTEND — NGINX CONFIG
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============ GZIP ============
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # ============ SPA ROUTING ============
    # Flutter web uses path-based routing
    # All unknown routes must hit index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============ STATIC ASSETS (LONG CACHE) ============
    # Flutter emits hash-named files (main.dart.js, etc.)
    # Cache them for 30 days — filename change busts cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|eot|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============ ENTRY POINTS (NO CACHE) ============
    # These change every deploy — must not be cached
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # ============ HEALTH CHECK ============
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ============ SECURITY HEADERS ============
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # ============ DENY SENSITIVE FILES ============
    location ~ /\.(env|git|htaccess|dockerignore) {
        deny all;
        return 404;
    }

    # ============ 404 FALLBACK ============
    error_page 404 /index.html;

    # ============ LOGGING ============
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}