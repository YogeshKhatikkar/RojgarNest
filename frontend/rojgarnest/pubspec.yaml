name: rojgarnest
description: "RojgarNext - Ultimate Job Portal Platform"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ==================== CORE ====================
  intl: ^0.20.2
  provider: ^6.1.0
  dio: ^5.7.0
  http: ^1.1.0
  http_parser: ^4.0.0

  # ==================== STORAGE ====================
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # ==================== FILE HANDLING ====================
  file_picker: ^8.3.0
  image_picker: ^1.0.7
  open_filex: ^4.5.0
  share_plus: ^10.1.4

  # ==================== UI ====================
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.0
  cupertino_icons: ^1.0.8
  lottie: ^3.3.0
  fl_chart: ^1.2.0
  responsive_builder: ^0.7.0
  flutter_widget_from_html: ^0.15.0

  # ==================== NAVIGATION ====================
  go_router: ^17.3.0
  url_launcher: ^6.3.1

  # ==================== PLATFORM ====================
  geolocator: ^10.1.1
  permission_handler: ^11.0.0
  device_info_plus: ^9.1.0
  connectivity_plus: ^7.2.0
  universal_io: ^2.0.0
  webview_flutter: ^4.10.0

  # ==================== AUTH ====================
  local_auth: ^2.1.0

  # ==================== PAYMENTS ====================
  razorpay_flutter: ^1.3.4
  qr_flutter: ^4.0.0

  # ==================== PDF & PRINTING ====================
  printing: ^5.11.0
  pdf: ^3.10.0

  # ✅ FIXED: Pinned to a stable version (avoids intl conflict & API break)
  flutter_pdfview: 1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/