# ============================================================
# SevaNext — FLUTTER WEB NGINX CONFIG
# ============================================================
# Serves Flutter web build + reverse-proxies:
#   /api/v1/*       → backend:8000/api/v1/*
#   /notification/* → backend:8000/notification/*   (WebSocket)
#   /uploads/*      → backend:8000/uploads/*
#   /docs           → backend:8000/docs             (Swagger)
#   /openapi.json   → backend:8000/openapi.json
#
# Zero CORS: browser sees everything as same-origin.
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # ✅ Global limits
    # ============================================================
    client_max_body_size 50M;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ============================================================
    # ✅ Gzip
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        application/wasm
        image/svg+xml
        application/manifest+json;

    # ============================================================
    # ✅ SECURITY HEADERS — set ONCE here, nginx inherits to all
    #    locations EXCEPT where an add_header is redefined
    #    (nginx quirk: any child add_header removes inherited ones)
    # ============================================================
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-XSS-Protection       "1; mode=block"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "geolocation=(self), microphone=(), camera=()" always;

    # ============================================================
    # ✅ Health check for Docker
    # ============================================================
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # ✅ BACKEND API PROXY — zero CORS
    # Browser calls same-origin /api/v1/* → nginx forwards to backend
    # ✅ KEEP trailing slash on BOTH sides (correct)
    # ============================================================
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_set_header Connection         "";
        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;

        # ✅ Re-declare security headers (nginx child overrides)
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ============================================================
    # ✅ WebSocket proxy (real-time notifications)
    # ============================================================
    location /notification/ {
        proxy_pass http://backend:8000/notification/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
    }

    # ============================================================
    # ✅ Uploads proxy (document viewer / PDFs / images)
    # ============================================================
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;

        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
    }

    # ============================================================
    # ✅ Swagger UI + OpenAPI
    # ============================================================
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $host;
    }

    # ============================================================
    # ✅ Static assets cache (Flutter hashed filenames — safe 30d)
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================================
    # ✅ SPA fallback — CRITICAL for Flutter Web routing
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }
}