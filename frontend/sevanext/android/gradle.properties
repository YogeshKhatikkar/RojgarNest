# ============================================================
# ✅ FIX: Kotlin cross-drive incremental cache error
# ============================================================
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.compiler.execution.strategy=in-process

# ============================================================
# Gradle JVM / performance
# ============================================================
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# ============================================================
# AndroidX & R8
# ============================================================
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ============================================================
# Suppress Kotlin compile warnings spam
# ============================================================
kotlin.code.style=official
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
