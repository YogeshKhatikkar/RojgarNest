# ============================================================
# NIXPACKS CONFIG - Railway auto-detection fallback
# ============================================================
[phases.setup]
nixPkgs = ["python312", "gcc", "g++", "libpq"]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel",
  "pip install -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile -"