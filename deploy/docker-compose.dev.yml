# ============================================================
# ROJGARNEST — DEVELOPMENT OVERRIDE
# ============================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ============================================================

services:
  mongo:
    ports:
      # Expose MongoDB locally for debugging (MongoDB Compass)
      - "27017:27017"

  redis:
    ports:
      # Expose Redis locally for debugging (redis-cli)
      - "6379:6379"

  backend:
    environment:
      ENVIRONMENT: development
      MOBILE_OTP_BYPASS: "true"
      DEV_MODE_LOG_ONLY: "false"
      LOG_LEVEL: DEBUG
    ports:
      # Expose backend directly for testing (bypass frontend)
      - "8000:8000"
    # ✅ Dev: mount source code for live-reload (optional)
    # volumes:
    #   - ../backend/rojgarnest/app:/app/app:ro

  frontend:
    build:
      args:
        API_BASE_URL: http://localhost:8000/api/v1
        WS_BASE_URL: ws://localhost:8000/notification/ws
    ports:
      - "8080:80"   # Dev frontend on 8080, not 80