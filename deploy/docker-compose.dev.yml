services:
  mongo:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  backend:
    environment:
      ENVIRONMENT: development
      MOBILE_OTP_BYPASS: "true"
      DEV_MODE_LOG_ONLY: "true"
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"

  frontend:
    build:
      args:
        API_BASE_URL: http://localhost:8000/api/v1
        WS_BASE_URL: ws://localhost:8000/notification/ws
    ports:
      - "8080:80"