services:
  mongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }
    restart: always

  redis:
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 64M }
    restart: always

  backend:
    environment:
      ENVIRONMENT: production
      MOBILE_OTP_BYPASS: "false"
      DEV_MODE_LOG_ONLY: "false"
      LOG_LEVEL: WARNING
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/SevaNext?authSource=admin
      APP_BASE_URL: https://${DOMAIN}
    restart: always
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 512M }

  frontend:
    build:
      args:
        API_BASE_URL: https://${DOMAIN}/api/v1
        WS_BASE_URL: wss://${DOMAIN}/ws/notification/ws
    restart: always
    ports:
      - "80:80"
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 128M }