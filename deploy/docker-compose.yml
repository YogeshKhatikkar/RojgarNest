services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: RojgarNest
    volumes:
      - mongo_data:/data/db
    networks:
      - rojgarnest-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - rojgarnest-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend/rojgarnest
      dockerfile: Dockerfile
    container_name: rojgarnest-local-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/RojgarNest
      DATABASE_NAME: RojgarNest
      REDIS_URL: redis://redis:6379
      PORT: "8000"
      ENVIRONMENT: development
    env_file:
      - ../backend/rojgarnest/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # ✅ EXPOSE 8000 so Swagger/docs accessible from browser directly
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_secure:/app/secure
      - backend_models:/app/models
      - backend_logs:/app/logs
      - backend_backups:/app/backups
    networks:
      - rojgarnest-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ../frontend/rojgarnest
      dockerfile: Dockerfile
      args:
        # ✅ PROXY MODE — same-origin, zero CORS issues
        #    nginx.conf forwards /api/v1/* → backend:8000/api/v1/*
        API_BASE_URL: /api/v1
        WS_BASE_URL: /notification/ws
        BUILD_NUMBER: "1"
        BUILD_NAME: "2.0.0"
    container_name: rojgarnest-local-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # ✅ FIXED: 80 → 8080 (Windows me port 80 reserved)
      - "8080:80"
    networks:
      - rojgarnest-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  rojgarnest-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  backend_uploads:
  backend_secure:
  backend_models:
  backend_logs:
  backend_backups: